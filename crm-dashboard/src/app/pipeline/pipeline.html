<div class="p-6 bg-gray-50 min-h-screen">
  <!-- Header & Filters Bar -->
  <div class="flex flex-wrap justify-between items-center mb-6 gap-4 bg-white p-4 rounded-lg shadow-sm">
    <div class="flex items-center gap-4">
      <h1 class="text-xl font-bold text-gray-800">CRM Pipeline</h1>
    </div>
    <div class="flex flex-wrap items-center gap-3">
      <input type="text" [(ngModel)]="searchTerm" placeholder="Functional text search" class="px-3 py-1.5 border rounded-md text-sm w-56 bg-gray-50" />
      <select [(ngModel)]="selectedPipeline" class="px-3 py-1.5 border rounded-md text-sm bg-gray-50">
        <option *ngFor="let p of pipelines" [value]="p">{{ p }}</option>
      </select>
      <button (click)="clearSearch()" class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md">Reset Filter</button>
      <button (click)="openModal()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md">+ Add New Deal</button>
    </div>
  </div>

  <!-- Pipeline Columns Grid -->
  <div class="grid grid-cols-1 md:grid-cols-5 gap-4" cdkDropListGroup>
    <div *ngFor="let stage of stages" class="bg-gray-100/70 p-3 rounded-lg flex flex-col min-h-[500px]">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-gray-200">
        <span class="font-semibold text-sm text-gray-700">{{ stage }}</span>
        <span class="bg-gray-200 text-gray-600 text-xs px-2 py-0.5 rounded-full font-bold">{{ getStageCount(stage) }}</span>
      </div>

      <!-- Cards Container -->
      <div class="flex-1 space-y-3 overflow-y-auto" cdkDropList [cdkDropListData]="getFilteredDeals(stage)" (cdkDropListDropped)="drop($event, stage)">
        <div *ngFor="let deal of getFilteredDeals(stage)" cdkDrag class="bg-white p-3.5 rounded-md shadow-sm border-l-4 border-blue-500 text-xs space-y-2 cursor-pointer hover:shadow-md transition-shadow">
          <h4 class="font-bold text-gray-800 text-sm">{{ deal.title }}</h4>
          <div>
            <p class="text-gray-400 text-[10px]">Expected Closing Date</p>
            <p class="text-gray-600 font-medium">{{ deal.closingDate }}</p>
          </div>
          <div>
            <p class="text-gray-400 text-[10px]">Deal Value</p>
            <p class="text-gray-800 font-bold">LKR {{ deal.value | number }}</p>
          </div>
          <div class="flex justify-between items-center pt-2 border-t border-gray-100">
            <span class="flex items-center gap-1 text-gray-600">👤 {{ deal.assignedTo }}</span>
            <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold" [ngClass]="{'bg-red-50 text-red-600': deal.priority==='High', 'bg-yellow-50 text-yellow-600': deal.priority==='Medium', 'bg-green-50 text-green-600': deal.priority==='Low'}">{{ deal.priority }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
