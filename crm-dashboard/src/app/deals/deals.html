<div class="deals-container">
  <!-- Top Bar: Search and Dropdown Filter -->
  <div class="deals-header-bar">

      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search deals..." class="search-input" />

      <select class="filter-dropdown">

        <option>QuickDeal</option>
        <option>Enterprise Deal</option>

  </div>

          <th>Stage</th>
          <th>Value (LKR)</th>
          <th>Close Date</th>
          <th>Owner</th>

        </tr>
        <tr>
          <td><input type="checkbox" /></td>

        </tr>
        <tr>
          <td><input type="checkbox" /></td>
          <td class="font-bold">Deal Source Proposal</td>
          <td>A/Fa Fernando</td>
          <td><span class="badge badge-orange">Proposal</span></td>
          <td class="font-bold">LKR 450,000</td>
          <td>2026-11-05</td>
          <td><span class="owner-cell">👤 S. Fernando</span></td>
        </tr>
      </tbody>
    </table>
  </div>
