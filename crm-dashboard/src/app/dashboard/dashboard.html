<main class="dashboard-body">
  <!-- Summary Cards පමණක් මෙහි තබන්න -->
  <section class="summary-section">
    <h2>Dashboard Summary</h2>
    <div class="cards-grid">
      <div class="summary-card border-green">
        <div class="card-header">
          <div>
            <span class="card-title">Won Deals</span>
            <div class="card-value">28</div>
          </div>
          <div class="icon-circle icon-green">✓</div>
        </div>
        <div class="card-progress">
          <div class="progress-bar green-bg" style="width: 25%;"></div>
        </div>
        <div class="card-footer">Progress <span class="text-green">25%</span> in past month</div>
      </div>

      <div class="summary-card border-red">
        <div class="card-header">
          <div>
            <span class="card-title">Lost Deals</span>
            <div class="card-value">5</div>
          </div>
          <div class="icon-circle icon-red">✕</div>
        </div>
        <div class="card-progress">
          <div class="progress-bar red-bg" style="width: 25%;"></div>
        </div>
        <div class="card-footer">Progress <span class="text-red">25%</span> in past month</div>
      </div>

      <div class="summary-card border-blue">
        <div class="card-header">
          <div>
            <span class="card-title">Total Deals</span>
            <div class="card-value">33</div>
          </div>
          <div class="icon-square icon-blue">📁</div>
        </div>
        <div class="card-progress">
          <div class="progress-bar blue-bg" style="width: 75%;"></div>
        </div>
        <div class="card-footer">Progress <span class="text-blue">75%</span> in past month</div>
      </div>

      <div class="summary-card border-yellow">
        <div class="card-header">
          <div>
            <span class="card-title">Total Pipeline Value</span>
            <div class="card-value currency">LKR 7,500,000</div>
          </div>
          <div class="icon-circle icon-yellow">$</div>
        </div>
        <div class="card-progress">
          <div class="progress-bar yellow-bg" style="width: 26%;"></div>
        </div>
        <div class="card-footer">Progress <span class="text-yellow">26%</span> in past month</div>
      </div>
    </div>
  </section>
</main>
